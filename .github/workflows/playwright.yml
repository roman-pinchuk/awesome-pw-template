name: Playwright

on:
  push:
    branches: ['main']
    paths: &ci_paths
      - '.github/workflows/playwright.yml'
      - 'business/**'
      - 'infrastructure/**'
      - 'allurerc.mjs'
      - 'pages/**'
      - 'tests/**'
      - 'scripts/**'
      - '.github/report-site/**'
      - 'playwright.config.ts'
      - 'eslint.config.mjs'
      - 'tsconfig.json'
      - 'package.json'
      - 'package-lock.json'
      - '.env.example'
      - '.env.production'
  pull_request:
    paths: *ci_paths
  schedule:
    - cron: '0 13 * * 1,4'
      timezone: 'Asia/Jerusalem'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: '1'
  SKIP_INSTALL_SIMPLE_GIT_HOOKS: '1'
  PLAYWRIGHT_IMAGE: &playwright_image mcr.microsoft.com/playwright:v1.62.1-noble

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    container: *playwright_image
    steps:
      - uses: actions/checkout@v7
      - run: npm ci
      - run: npm run verify:playwright
      - run: npm run test:scripts
      - run: npm run typecheck
      - run: npm run lint

  api-tests:
    needs: lint
    if: ${{ github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: *playwright_image
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      - run: npm ci
      - name: Run API tests
        env:
          DOTENV_PRIVATE_KEY_PRODUCTION: ${{ secrets.DOTENV_PRIVATE_KEY_PRODUCTION }}
          CTRF_REPORT_FILE: ctrf-api.json
          PW_BLOB_NAME: api.zip
        run: npm run test:api:ci
      - name: Upload Playwright blob report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-blob-report-api
          path: blob-report/
          if-no-files-found: ignore
          retention-days: 1
      - name: Upload CTRF report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: raw-ctrf-api
          path: ctrf/ctrf-api.json
          if-no-files-found: ignore
          retention-days: 1
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-api
          path: allure-results/
          if-no-files-found: ignore
          retention-days: 1

  ui-tests:
    needs: lint
    if: ${{ github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: *playwright_image
    strategy:
      matrix:
        browser: [chromium, firefox, webkit]
      fail-fast: false
      max-parallel: 2
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      - run: npm ci
      - name: Run UI tests (${{ matrix.browser }})
        env:
          DOTENV_PRIVATE_KEY_PRODUCTION: ${{ secrets.DOTENV_PRIVATE_KEY_PRODUCTION }}
          CTRF_REPORT_FILE: ctrf-${{ matrix.browser }}.json
          PW_TARGET_BROWSER: ${{ matrix.browser }}
          PW_BLOB_NAME: ${{ matrix.browser }}.zip
          HOME: /root
        run: npx dotenvx run -f .env.production -- npx playwright test --project=${{ matrix.browser }}
      - name: Upload Playwright blob report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-blob-report-ui-${{ matrix.browser }}
          path: blob-report/
          if-no-files-found: ignore
          retention-days: 1
      - name: Upload CTRF report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: raw-ctrf-${{ matrix.browser }}
          path: ctrf/ctrf-${{ matrix.browser }}.json
          if-no-files-found: ignore
          retention-days: 1
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-ui-${{ matrix.browser }}
          path: allure-results/
          if-no-files-found: ignore
          retention-days: 1

  ctrf-report:
    needs: [api-tests, ui-tests]
    if: ${{ github.actor != 'dependabot[bot]' && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: raw-ctrf-*
          merge-multiple: true
      - name: Publish CTRF Summary
        uses: ctrf-io/github-test-reporter@v1.3.0
        with:
          report-path: 'ctrf-*.json'
          summary-report: true
          insights-report: true
          suite-folded-report: true
          group-by: 'suite'
          upload-artifact: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  report-site:
    needs: [api-tests, ui-tests]
    if: ${{ github.ref == 'refs/heads/main' && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: *playwright_image
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          pattern: playwright-blob-report-*
          path: blob-reports
          merge-multiple: true
      - name: Merge Playwright HTML report
        run: npx playwright merge-reports --reporter html blob-reports
      - uses: actions/download-artifact@v8
        with:
          pattern: raw-ctrf-*
          path: ctrf-input
          merge-multiple: true
      - name: Merge and render CTRF report
        run: |
          mkdir -p report-source/ctrf
          npx ctrf-cli merge ctrf-input --output "$GITHUB_WORKSPACE/report-source/ctrf/ctrf-report.json"
          test -s "$GITHUB_WORKSPACE/report-source/ctrf/ctrf-report.json"
          npx ctrf-html-reporter "$GITHUB_WORKSPACE/report-source/ctrf/ctrf-report.json" --output-path "$GITHUB_WORKSPACE/report-source/ctrf" --single-file
          rm "$GITHUB_WORKSPACE/report-source/ctrf/ctrf-report.json"
      - uses: actions/download-artifact@v8
        with:
          pattern: allure-results-*
          path: allure-results
          merge-multiple: true
      - name: Restore Allure history
        uses: actions/cache/restore@v6
        with:
          path: allure-history
          key: allure3-history-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: allure3-history-${{ github.ref_name }}-
      - name: Generate Allure report
        env:
          ALLURE_REPORT_BASE_URL: https://roman-pinchuk.github.io/awesome-pw-template/allure/history
          ALLURE_HISTORY_PATH: allure-history/history.jsonl
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
        run: |
          mkdir -p allure-history report-source/allure
          echo "Branch=${{ github.server_url }}/${{ github.repository }}/tree/${{ github.ref_name }}" >> allure-results/environment.properties
          echo "Commit=${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}" >> allure-results/environment.properties
          echo "Workflow=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> allure-results/environment.properties
          node scripts/write-allure-executor.mjs allure-results
          npx allure generate allure-results --output report-source/allure
          node scripts/publish-allure-report.mjs report-source/allure allure-history ${{ github.run_number }}
      - name: Assemble report site
        run: |
          cp .github/report-site/index.html report-source/index.html
          mkdir -p report-source/playwright
          cp -R playwright-report/. report-source/playwright/
          node scripts/build-report-site.mjs \
            --source report-source \
            --site pages-artifact \
            --history allure-history \
            --run-number '${{ github.run_number }}' \
            --base-url 'https://roman-pinchuk.github.io/awesome-pw-template' \
            --branch '${{ github.ref_name }}' \
            --commit '${{ github.sha }}' \
            --run-url '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}' \
            --max-reports 20 \
            --max-bytes 524288000
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: pages-artifact
          retention-days: 1
      - name: Save Allure history
        if: always()
        uses: actions/cache/save@v6
        with:
          path: allure-history
          key: allure3-history-${{ github.ref_name }}-${{ github.run_id }}

  allure-quality-gate:
    needs: [api-tests, ui-tests]
    if: ${{ github.ref == 'refs/heads/main' && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    container: *playwright_image
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          pattern: allure-results-*
          path: allure-results
          merge-multiple: true
      - name: Enforce Allure quality gate
        run: npx allure quality-gate allure-results

  deploy-pages:
    needs: [report-site]
    if: ${{ github.ref == 'refs/heads/main' && !cancelled() && needs.report-site.result == 'success' }}
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5
      - name: Retry deploy to GitHub Pages
        id: deployment_retry
        if: ${{ steps.deployment.outcome == 'failure' }}
        uses: actions/deploy-pages@v5
