name: Playwright

on:
  push:
    branches: ['main']
    # Run expensive tests only when testable code or CI config changes.
    paths: &ci_paths
      - '.github/workflows/playwright.yml'
      - 'business/**'
      - 'infrastructure/**'
      - 'allurerc.mjs'
      - 'pages/**'
      - 'tests/**'
      - 'scripts/**'
      - 'playwright.config.ts'
      - 'eslint.config.mjs'
      - 'tsconfig.json'
      - 'package.json'
      - 'package-lock.json'
      - '.env.example'
      - '.env.production'
  pull_request:
    paths: *ci_paths
  schedule:
    - cron: '0 13 * * 1,4'
      timezone: 'Asia/Jerusalem'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: '1'
  SKIP_INSTALL_SIMPLE_GIT_HOOKS: '1'
  PLAYWRIGHT_IMAGE: &playwright_image mcr.microsoft.com/playwright:v1.62.1-noble

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify:playwright
      - run: npm run test:scripts
      - run: npm run typecheck
      - run: npm run lint

  api-tests:
    needs: lint
    if: ${{ github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: *playwright_image
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      - run: npm ci
      - name: Run API tests
        env:
          DOTENV_PRIVATE_KEY_PRODUCTION: ${{ secrets.DOTENV_PRIVATE_KEY_PRODUCTION }}
          CTRF_REPORT_FILE: ctrf-api.json
        run: npm run test:api:ci
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-api
          path: playwright-report/
          retention-days: 7
      - name: Upload CTRF report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ctrf-api
          path: ctrf/ctrf-api.json
          retention-days: 7
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-api
          path: allure-results/
          retention-days: 7

  ui-tests:
    needs: lint
    if: ${{ github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: *playwright_image
    strategy:
      matrix:
        browser: [chromium, firefox, webkit]
      fail-fast: false
      max-parallel: 2
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      - run: npm ci
      - name: Run UI tests (${{ matrix.browser }})
        env:
          DOTENV_PRIVATE_KEY_PRODUCTION: ${{ secrets.DOTENV_PRIVATE_KEY_PRODUCTION }}
          CTRF_REPORT_FILE: ctrf-${{ matrix.browser }}.json
          PW_TARGET_BROWSER: ${{ matrix.browser }}
          # Fix Firefox crash in GitHub Actions
          # Details: https://github.com/microsoft/playwright/issues/6500#issuecomment-838515115
          HOME: /root
        run: npx dotenvx run -f .env.production -- npx playwright test --project=${{ matrix.browser }}
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-ui-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 7
      - name: Upload CTRF report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ctrf-${{ matrix.browser }}
          path: ctrf/ctrf-${{ matrix.browser }}.json
          retention-days: 7
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-ui-${{ matrix.browser }}
          path: allure-results/
          retention-days: 7

  ctrf-report:
    needs: [api-tests, ui-tests]
    if: ${{ github.actor != 'dependabot[bot]' && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: ctrf-*
          merge-multiple: true
      - name: Publish CTRF Summary
        uses: ctrf-io/github-test-reporter@v1.3.0
        with:
          report-path: 'ctrf-*.json'
          summary-report: true
          insights-report: true
          suite-folded-report: true
          group-by: 'suite'
          upload-artifact: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  allure-report:
    needs: [api-tests, ui-tests]
    if: ${{ github.ref == 'refs/heads/main' && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          pattern: allure-results-*
          path: allure-results
          merge-multiple: true
      - name: Restore Allure history
        uses: actions/cache/restore@v6
        with:
          path: allure-history
          key: allure3-history-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            allure3-history-${{ github.ref_name }}-
      - name: Generate environment properties
        env:
          ALLURE_REPORT_BASE_URL: https://roman-pinchuk.github.io/awesome-pw-template
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
        run: |
          mkdir -p allure-history
          echo "Branch=${{ github.server_url }}/${{ github.repository }}/tree/${{ github.ref_name }}" >> allure-results/environment.properties
          echo "Commit=${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}" >> allure-results/environment.properties
          echo "Workflow=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> allure-results/environment.properties
          node scripts/write-allure-executor.mjs allure-results
      - name: Generate Allure report
        env:
          ALLURE_HISTORY_PATH: allure-history/history.jsonl
          ALLURE_OUTPUT: allure-report
        run: npx allure generate allure-results --output allure-report
      - name: Publish Allure report files
        env:
          ALLURE_REPORT_BASE_URL: https://roman-pinchuk.github.io/awesome-pw-template
        run: node scripts/publish-allure-report.mjs allure-report allure-history ${{ github.run_number }}
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: allure-history
      - name: Save Allure history
        if: always()
        uses: actions/cache/save@v6
        with:
          path: allure-history
          key: allure3-history-${{ github.ref_name }}-${{ github.run_id }}

  allure-quality-gate:
    needs: [api-tests, ui-tests]
    if: ${{ github.ref == 'refs/heads/main' && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          pattern: allure-results-*
          path: allure-results
          merge-multiple: true
      - name: Enforce Allure quality gate
        run: npx allure quality-gate allure-results

  allure-deploy:
    needs: [allure-report]
    if: ${{ github.ref == 'refs/heads/main' && !cancelled() && needs.allure-report.result == 'success' }}
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5
      # GitHub Pages sometimes accepts the artifact, then returns
      # "Deployment failed, try again later." A rerun of the same artifact
      # usually succeeds, so retry once before failing the job.
      - name: Retry deploy to GitHub Pages
        id: deployment_retry
        if: ${{ steps.deployment.outcome == 'failure' }}
        uses: actions/deploy-pages@v5
